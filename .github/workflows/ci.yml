name: C CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: GCC build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with strict warnings
        run: |
          make clean
          make CC=gcc CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Run tests
        run: |
          make test CC=gcc CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"

  clang:
    name: Clang build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with strict warnings
        run: |
          make clean
          make CC=clang CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Run tests
        run: |
          make test CC=clang CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with sanitizers
        run: |
          make clean
          make CC=gcc CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Run tests with sanitizers
        run: |
          make test CC=gcc CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

  valgrind:
    name: Valgrind memory checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build and run test suite
        run: |
          make clean
          make test CC=gcc CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror"

      - name: Run all tests under Valgrind
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_rng
            tests/test_game
            tests/test_agents
            tests/test_minimax
            tests/test_alphabeta
            tests/test_samuel
            tests/test_genetic
            tests/test_qlearning
            tests/test_experiment
          )

          for test_binary in "${tests[@]}"; do
            echo "::group::Valgrind ${test_binary}"
            valgrind \
              --quiet \
              --leak-check=full \
              --show-leak-kinds=all \
              --errors-for-leak-kinds=all \
              --track-origins=yes \
              --error-exitcode=1 \
              "./${test_binary}"
            echo "::endgroup::"
          done
